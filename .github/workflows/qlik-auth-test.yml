
name: Qlik OAuth and Base App Discovery

on:
  workflow_dispatch:

jobs:
  discover-base-app:
    name: Authenticate and Find Base App
    runs-on: ubuntu-latest

    outputs:
      app_id: ${{ steps.find_app.outputs.app_id }}

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Qlik OAuth Authentication
      - name: Get Qlik OAuth Access Token
        id: oauth
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
          QLIK_CLIENT_ID: ${{ secrets.QLIK_CLIENT_ID }}
          QLIK_CLIENT_SECRET: ${{ secrets.QLIK_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error

          tenant = os.environ["QLIK_TENANT_URL"].rstrip("/")

          if not tenant.startswith("https://"):
              raise SystemExit("ERROR: Invalid Qlik tenant URL")

          payload = {
              "client_id": os.environ["QLIK_CLIENT_ID"],
              "client_secret": os.environ["QLIK_CLIENT_SECRET"],
              "grant_type": "client_credentials"
          }

          data = urllib.parse.urlencode(payload).encode("utf-8")

          request = urllib.request.Request(
              f"{tenant}/oauth/token",
              data=data,
              headers={
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Accept": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read())

              token = result.get("access_token")

              if not token:
                  raise RuntimeError("Access token not received")

              with open(os.environ["GITHUB_ENV"], "a") as file:
                  file.write(f"QLIK_ACCESS_TOKEN={token}\n")

              print("SUCCESS: OAuth authentication completed.")

          except urllib.error.HTTPError as error:
              raise SystemExit(
                  f"OAuth authentication failed. HTTP {error.code}"
              )

          except Exception as error:
              raise SystemExit(
                  f"OAuth error: {type(error).__name__}"
              )
          PY

      # Step 4: Dynamic Base App Discovery
      - name: Discover Base Application
        id: find_app
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
        run: |
          python .github/scripts/get_base_app.py

      # Step 5: Validate Discovery Result
      - name: Validate Base App Discovery
        env:
          APP_ID: ${{ steps.find_app.outputs.app_id }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "ERROR: Base App ID not found."
            exit 1
          fi

          echo "SUCCESS: Base Application discovered."
          echo "App ID retrieved successfully."
