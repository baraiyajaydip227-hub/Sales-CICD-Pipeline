
name: Qlik No-Data QVF Build and DEV Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  # ==========================================
  # JOB 1: BUILD QVF
  # ==========================================

  build-qvf:
    name: Discover and Export QVF
    runs-on: ubuntu-latest

    outputs:
      app_id: ${{ steps.find_app.outputs.app_id }}
      qvf_path: ${{ steps.export_qvf.outputs.qvf_path }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get Qlik API Access
        env:
          QLIK_API_KEY: ${{ secrets.QLIK_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          api_key = os.environ.get("QLIK_API_KEY")

          if not api_key:
              sys.exit("QLIK_API_KEY is missing.")

          with open(os.environ["GITHUB_ENV"], "a") as file:
              file.write(f"QLIK_ACCESS_TOKEN={api_key}\n")

          print("Qlik API authentication successful.")
          PY

      - name: Discover Base Application
        id: find_app
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
        run: |
          python .github/scripts/get_base_app.py

      - name: Export No-Data QVF
        id: export_qvf
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
          QLIK_APP_ID: ${{ steps.find_app.outputs.app_id }}
        run: |
          python .github/generator/export_qvf.py

      - name: Upload QVF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sales-QVF-Build-${{ github.run_number }}
          path: ${{ steps.export_qvf.outputs.qvf_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        run: |
          echo "QVF Build Successful."
          echo "Base Application: Sales_RAW_Ingestion"
          echo "No-Data Export: Enabled"
          echo "Artifact Uploaded Successfully."

  # ==========================================
  # JOB 2: DEPLOY QVF TO DEV
  # ==========================================

  deploy-dev:
    name: Deploy QVF to DEV
    runs-on: ubuntu-latest
    needs: build-qvf

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download QVF Artifact
        uses: actions/download-artifact@v4
        with:
          name: Sales-QVF-Build-${{ github.run_number }}
          path: dist

      - name: Configure Qlik API Access
        env:
          QLIK_API_KEY: ${{ secrets.QLIK_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          api_key = os.environ.get("QLIK_API_KEY")

          if not api_key:
              sys.exit("QLIK_API_KEY is missing.")

          with open(os.environ["GITHUB_ENV"], "a") as file:
              file.write(f"QLIK_ACCESS_TOKEN={api_key}\n")

          print("Qlik API authentication configured.")
          PY

      - name: Deploy QVF to DEV
        id: deploy
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
          TARGET_ENV: DEV
        run: |
          python .github/generator/deploy_qvf.py

      - name: DEV Deployment Summary
        if: success()
        run: |
          echo "DEV Deployment Successful."
          echo "Environment: DEV"
          echo "Application ID: ${{ steps.deploy.outputs.app_id }}"
          echo "QVF Artifact: Same Build Artifact"
