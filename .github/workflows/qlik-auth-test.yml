
name: Qlik No-Data QVF Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qvf:
    name: Discover and Export QVF
    runs-on: ubuntu-latest

    outputs:
      app_id: ${{ steps.find_app.outputs.app_id }}
      qvf_path: ${{ steps.export_qvf.outputs.qvf_path }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get Qlik OAuth Access Token
        id: oauth
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
          QLIK_CLIENT_ID: ${{ secrets.QLIK_CLIENT_ID }}
          QLIK_CLIENT_SECRET: ${{ secrets.QLIK_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request
          import urllib.parse

          tenant = os.environ["QLIK_TENANT_URL"].rstrip("/")

          payload = {
              "client_id": os.environ["QLIK_CLIENT_ID"],
              "client_secret": os.environ["QLIK_CLIENT_SECRET"],
              "grant_type": "client_credentials"
          }

          request = urllib.request.Request(
              f"{tenant}/oauth/token",
              data=urllib.parse.urlencode(payload).encode(),
              headers={
                  "Content-Type": "application/x-www-form-urlencoded"
              },
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.loads(response.read())

          token = result.get("access_token")

          if not token:
              raise SystemExit("OAuth token not received.")

          # Inspect OAuth token claims without printing the token
          parts = token.split(".")

          if len(parts) == 3:
              payload_part = parts[1]
              payload_part += "=" * (-len(payload_part) % 4)

              claims = json.loads(
                  base64.urlsafe_b64decode(payload_part)
              )

              print("OAuth Granted Scopes:")
              print(claims.get("scope", "Scope claim not found"))

              print("OAuth Token Issuer:")
              print(claims.get("iss", "Not available"))

              print("OAuth Token Audience:")
              print(claims.get("aud", "Not available"))
          else:
              print(
                  "OAuth token is opaque; JWT scope inspection unavailable."
              )

          # Pass token securely to subsequent workflow steps
          with open(os.environ["GITHUB_ENV"], "a") as file:
              file.write(f"QLIK_ACCESS_TOKEN={token}\n")

          print("OAuth authentication successful.")
          PY

      - name: Discover Base Application
        id: find_app
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
        run: |
          python .github/scripts/get_base_app.py

      - name: Export No-Data QVF
        id: export_qvf
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
          QLIK_APP_ID: ${{ steps.find_app.outputs.app_id }}
        run: |
          python .github/generator/export_qvf.py

      - name: Upload QVF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sales-QVF-Build-${{ github.run_number }}
          path: ${{ steps.export_qvf.outputs.qvf_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: success()
        run: |
          echo "QVF Build Successful."
          echo "Base Application: Sales_RAW_Ingestion"
          echo "No-Data Export: Enabled"
          echo "Versioned Artifact: Uploaded"
