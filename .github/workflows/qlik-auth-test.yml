
name: Qlik No-Data QVF Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qvf:
    name: Discover and Export QVF
    runs-on: ubuntu-latest

    outputs:
      app_id: ${{ steps.find_app.outputs.app_id }}
      qvf_path: ${{ steps.export_qvf.outputs.qvf_path }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 1: Configure Qlik API Key
      - name: Get Qlik API Access
        id: api_auth
        env:
          QLIK_API_KEY: ${{ secrets.QLIK_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          api_key = os.environ.get("QLIK_API_KEY")

          if not api_key:
              print("ERROR: QLIK_API_KEY is missing.")
              sys.exit(1)

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as file:
              file.write(
                  f"QLIK_ACCESS_TOKEN={api_key}\n"
              )

          print("Qlik API authentication configured.")
          print("API Key received successfully.")
          PY

      # Step 2: Discover Base Application
      - name: Discover Base Application
        id: find_app
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
        run: |
          python .github/scripts/get_base_app.py

      # Step 3: Export No-Data QVF
      - name: Export No-Data QVF
        id: export_qvf
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
          QLIK_APP_ID: ${{ steps.find_app.outputs.app_id }}
        run: |
          python .github/generator/export_qvf.py

      # Step 4: Upload QVF Artifact
      - name: Upload QVF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sales-QVF-Build-${{ github.run_number }}
          path: ${{ steps.export_qvf.outputs.qvf_path }}
          if-no-files-found: error
          retention-days: 30

      # Step 5: Build Summary
      - name: Build Summary
        if: success()
        run: |
          echo "QVF Build Successful."
          echo "Base Application: Sales_RAW_Ingestion"
          echo "Authentication: Qlik API Key"
          echo "No-Data Export: Enabled"
          echo "Versioned Artifact: Uploaded"
