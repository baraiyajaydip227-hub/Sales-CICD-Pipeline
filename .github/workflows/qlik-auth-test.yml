
name: Qlik No-Data QVF Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-qvf:
    name: Discover and Export QVF
    runs-on: ubuntu-latest

    outputs:
      app_id: ${{ steps.find_app.outputs.app_id }}
      qvf_path: ${{ steps.export_qvf.outputs.qvf_path }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get Qlik OAuth Access Token
        id: oauth
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
          QLIK_CLIENT_ID: ${{ secrets.QLIK_CLIENT_ID }}
          QLIK_CLIENT_SECRET: ${{ secrets.QLIK_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error

          tenant = os.environ["QLIK_TENANT_URL"].rstrip("/")

          payload = {
              "client_id": os.environ["QLIK_CLIENT_ID"],
              "client_secret": os.environ["QLIK_CLIENT_SECRET"],
              "grant_type": "client_credentials",
              "scope": "admin.apps"
          }

          request = urllib.request.Request(
              f"{tenant}/oauth/token",
              data=urllib.parse.urlencode(payload).encode(),
              headers={
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Accept": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  result = json.loads(response.read())

          except urllib.error.HTTPError as error:
              error_body = error.read().decode(
                  "utf-8", errors="replace"
              )
              print(f"OAuth HTTP Error: {error.code}")
              print(f"OAuth Response: {error_body}")
              raise SystemExit("OAuth authentication failed.")

          token = result.get("access_token")

          if not token:
              raise SystemExit("OAuth token not received.")

          # Read actual granted scopes from OAuth response
          granted_scopes = result.get("scope")

          print("OAuth Granted Scopes:")

          if granted_scopes:
              print(granted_scopes)
          else:
              print("Scope field not returned by OAuth response.")

          print("OAuth Token Issuer:")
          print("Token received successfully.")

          print("OAuth Token Audience:")
          print("Tenant:", tenant)

          # Store token securely for later workflow steps
          with open(
              os.environ["GITHUB_ENV"], "a", encoding="utf-8"
          ) as file:
              file.write(f"QLIK_ACCESS_TOKEN={token}\n")

          print("OAuth authentication successful.")
          PY

      - name: Discover Base Application
        id: find_app
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
        run: |
          python .github/scripts/get_base_app.py

      - name: Export No-Data QVF
        id: export_qvf
        env:
          QLIK_TENANT_URL: ${{ secrets.QLIK_TENANT_URL }}
          QLIK_APP_ID: ${{ steps.find_app.outputs.app_id }}
        run: |
          python .github/generator/export_qvf.py

      - name: Upload QVF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sales-QVF-Build-${{ github.run_number }}
          path: ${{ steps.export_qvf.outputs.qvf_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: success()
        run: |
          echo "QVF Build Successful."
          echo "Base Application: Sales_RAW_Ingestion"
          echo "No-Data Export: Enabled"
          echo "Versioned Artifact: Uploaded"
